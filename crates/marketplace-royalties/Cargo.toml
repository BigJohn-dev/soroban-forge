[package]
name = "soroban-forge-marketplace-royalties"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Marketplace royalties contract for Soroban Forge"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk.workspace = true
soroban-forge-shared-utils = { path = "../shared-utils", version = "0.2.0" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
soroban-forge-test-utils = { path = "../test-utils", version = "0.2.0" }
proptest = "1"
