name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo doc --workspace --no-deps --locked --document-private-items

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets --locked

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    # audit-check publishes its result as a check run on the commit.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  dependency-policy:
    name: Dependency Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny
      - name: Check dependency sources
        run: cargo deny check sources
      - name: Check dependency bans
        run: cargo deny check bans

  wasm-size:
    name: WASM Size Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      # Build only the contract crates for the WASM target; shared/test-utils
      # are not deployable artifacts. NOTE: keep this list in sync with the
      # contract crates added to the workspace.
      - name: Build contract WASM artifacts
        run: |
          cargo build --locked --release --target wasm32v1-none \
            --package soroban-forge-escrow \
            --package soroban-forge-vesting \
            --package soroban-forge-multi-sig-wallet \
            --package soroban-forge-dao-governance \
            --package soroban-forge-subscription-payments \
            --package soroban-forge-marketplace-royalties
      - name: Report WASM artifact sizes
        run: |
          shopt -s nullglob
          for wasm in target/wasm32v1-none/release/*.wasm; do
            echo "$(basename "$wasm"): $(stat -c%s "$wasm") bytes"
          done
      - name: Enforce maximum WASM size
        run: |
          MAX_SIZE=150000
          shopt -s nullglob
          found=0
          for wasm in target/wasm32v1-none/release/*.wasm; do
            found=1
            SIZE=$(stat -c%s "$wasm")
            if [ "$SIZE" -gt "$MAX_SIZE" ]; then
              echo "::error::$wasm exceeds $MAX_SIZE bytes: $SIZE bytes"
              exit 1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No WASM artifacts were produced; the size check cannot run"
            exit 1
          fi

  typescript-sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: packages/typescript-sdk/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: packages/typescript-sdk
      - name: Run offline tests
        run: npm test
        working-directory: packages/typescript-sdk
      - name: Build distribution
        run: npm run build
        working-directory: packages/typescript-sdk

  provenance:
    name: Provenance Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The manifest records the exact git revision the artifacts were
          # built from, so the checkout must not be shallow.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Build artifacts and generate manifest
        run: scripts/provenance.sh build
      - name: Verify artifacts reproduce from a clean build
        run: |
          # A drift-free rebuild from the same tree is the whole point of
          # the manifest: verify from scratch, not against warm caches.
          cargo clean
          scripts/provenance.sh verify
      - name: Upload provenance manifest
        uses: actions/upload-artifact@v4
        with:
          name: provenance-manifest
          path: provenance-manifest.json
          if-no-files-found: error
